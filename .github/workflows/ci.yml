name: CI

on:
  push:
    branches: [main, stable, beta, nightly]
  pull_request:

jobs:
  check:
    name: Lint, Type Check, Format, and Build
    runs-on: ${{ fromJSON(vars.OFFICE_RUNNERS == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","Linux","x64","office"]' || '"ubuntu-latest"') }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run regression tests
        run: npm test

      - name: 💅 Run Prettier (check mode)
        run: npx prettier . --check

      - name: 🧹 Run ESLint
        run: npx eslint . --ext .ts,.tsx,.js,.jsx

      - name: 🧠 TypeScript type check
        run: npx tsc --noEmit

      - name: 🛠️ Build the project
        run: npm run build
